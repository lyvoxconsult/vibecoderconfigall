# Configuração de MCPs para Codex (Exemplo Seguro)

[mcpServers.cloudrun]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp"]

[mcpServers.supabase]
serverUrl = "https://mcp.supabase.com/mcp"

[mcpServers.StitchMCP]
command = "npx"
args = [
  "-y",
  "mcp-remote",
  "https://stitch.googleapis.com/mcp",
  "--header",
  "X-Goog-Api-Key: INSIRA_SUA_CHAVE_STITCH_AQUI"
]

[mcpServers.github-mcp-server]
command = "docker"
args = [
  "run",
  "-i",
  "--rm",
  "-e",
  "GITHUB_PERSONAL_ACCESS_TOKEN",
  "ghcr.io/github/github-mcp-server"
]

[mcpServers.github-mcp-server.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "INSIRA_SEU_GITHUB_PAT_AQUI"
